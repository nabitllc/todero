name: PR

on:
  pull_request:
    # `labeled` is included so adding the `full-ci` label starts the full
    # matrix without a new push. See the scope step in pr-trusted.yml.
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # This fork calls the trusted workflow from the same checkout instead of
    # pinning a commit SHA. Only maintainers open pull requests here, and the
    # upstream pin needs a second "activation" PR for every workflow change.
    # Restore the `nabitllc/todero/.github/workflows/pr-trusted.yml@<sha>` pin
    # when outside contributors arrive.
    uses: ./.github/workflows/pr-trusted.yml

name: Commit Message Check
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  check-commit-messages:
    name: Validate commit messages contain issue key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          # Check all commits in PR or push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          COMMITS=$(git log --format="%H %s" ${BASE}..${HEAD} 2>/dev/null || git log --format="%H %s" -10)
          FAILED=0

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            # TOD-2490: an automatic checkpointer commits the whole working tree
            # on a timer, so a long session produces commits nobody authored —
            # 27 of them in one day. Their subject is exactly
            # "checkpoint: <YYYY-MM-DD_HH:MM:SS>" and nothing in this repo
            # controls that format; the checkpointer is part of the harness.
            #
            # They are EXEMPT, and the alternative was worse. Rewriting them to
            # carry a ticket would attach invented provenance to a machine
            # commit — the same defect class as a stale "Measured:" comment,
            # which this codebase has now been bitten by three times.
            #
            # The pattern is deliberately EXACT: the literal word, a timestamp,
            # end of line. "checkpoint: fixing the thing" still fails, because
            # that is an authored change wearing a machine's clothes.
            if echo "$MSG" | grep -qE '^checkpoint: [0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
              echo "⏭  automatic checkpoint, exempt: $MSG"
            elif ! echo "$MSG" | grep -qE '(MC|INF|VES|KEM|TOD|TASK)-[0-9]+'; then
              echo "❌ Missing issue key: $MSG ($HASH)"
              FAILED=1
            else
              echo "✅ OK: $MSG"
            fi
          done <<< "$COMMITS"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "All commit messages must include an issue key like: feat(MC-42): description"
            exit 1
          fi

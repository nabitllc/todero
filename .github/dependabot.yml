version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # One grouped pull request per week for minor and patch updates, and a
    # separate pull request per major update. Every pull request here runs
    # the full 22-job check matrix, so the count of pull requests is the CI
    # bill: twenty separate bumps in one morning consumed the month's free
    # runner minutes and stopped every check from starting. Majors stay
    # separate because a grouped major cannot merge while one member is
    # blocked, which hides the other ready majors.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Dependabot's npm parser reads only dependencies, devDependencies, and
    # optionalDependencies — never peerDependencies. It cannot see the
    # optional OpenTelemetry peer dependencies in server/package.json, so it
    # never bumps their declared versions. The same limit applies to the
    # optional @sentry/node peer dependency in server/package.json: Dependabot
    # cannot bump it either, for the same reason. @sentry/browser stays a
    # normal devDependency of ui/package.json, so Dependabot does track that
    # one.
    ignore:
      # @types/node describes the APIs available in the supported Node runtime.
      # Runtime major upgrades are deliberate compatibility changes, so keep
      # Dependabot on the current major until the runtime baseline moves too.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
